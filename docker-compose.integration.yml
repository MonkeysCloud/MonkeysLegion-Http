services:
  redis:
    image: redis:7-alpine
    container_name: monkeyslegion-http-redis
    command: ["redis-server", "--save", ""]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
